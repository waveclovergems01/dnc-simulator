<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="eg" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="55%" stop-color="#909090"/>
      <stop offset="100%" stop-color="#484848"/>
    </radialGradient>
    <radialGradient id="egemL" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="50%" stop-color="#b8b8b8"/>
      <stop offset="100%" stop-color="#484848"/>
    </radialGradient>
  </defs>
  <!-- Left earring -->
  <g transform="translate(0,0)">
    <!-- Hook -->
    <path d="M16 8 Q12 8 10 12 Q9 17 12 20 L14 20" fill="none" stroke="url(#eg)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Hook tip ball -->
    <circle cx="16" cy="8" r="2" fill="#c8c8c8" stroke="#3a3a3a" stroke-width="0.6"/>
    <!-- Chain/drop link -->
    <line x1="14" y1="20" x2="14" y2="28" stroke="#a0a0a0" stroke-width="1.5"/>
    <ellipse cx="14" cy="24" rx="2" ry="1.5" fill="none" stroke="#888" stroke-width="1"/>
    <!-- Pendant top -->
    <path d="M10 28 L18 28 L16 34 L12 34 Z" fill="url(#eg)" stroke="#2a2a2a" stroke-width="0.7"/>
    <!-- Gem drop -->
    <ellipse cx="14" cy="42" rx="5" ry="7" fill="url(#egemL)" stroke="#2a2a2a" stroke-width="0.7"/>
    <!-- Gem facets -->
    <line x1="14" y1="35" x2="14" y2="49" stroke="#c0c0c0" stroke-width="0.5"/>
    <line x1="9" y1="42" x2="19" y2="42" stroke="#c0c0c0" stroke-width="0.5"/>
    <line x1="10" y1="37" x2="18" y2="47" stroke="#c0c0c0" stroke-width="0.4"/>
    <line x1="18" y1="37" x2="10" y2="47" stroke="#c0c0c0" stroke-width="0.4"/>
    <!-- Gem highlight -->
    <ellipse cx="12" cy="39" rx="2" ry="1.5" fill="#f8f8f8" opacity="0.85"/>
  </g>
  <!-- Right earring (mirrored) -->
  <g transform="translate(64,0) scale(-1,1)">
    <path d="M16 8 Q12 8 10 12 Q9 17 12 20 L14 20" fill="none" stroke="url(#eg)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="16" cy="8" r="2" fill="#c8c8c8" stroke="#3a3a3a" stroke-width="0.6"/>
    <line x1="14" y1="20" x2="14" y2="28" stroke="#a0a0a0" stroke-width="1.5"/>
    <ellipse cx="14" cy="24" rx="2" ry="1.5" fill="none" stroke="#888" stroke-width="1"/>
    <path d="M10 28 L18 28 L16 34 L12 34 Z" fill="url(#eg)" stroke="#2a2a2a" stroke-width="0.7"/>
    <ellipse cx="14" cy="42" rx="5" ry="7" fill="url(#egemL)" stroke="#2a2a2a" stroke-width="0.7"/>
    <line x1="14" y1="35" x2="14" y2="49" stroke="#c0c0c0" stroke-width="0.5"/>
    <line x1="9" y1="42" x2="19" y2="42" stroke="#c0c0c0" stroke-width="0.5"/>
    <line x1="10" y1="37" x2="18" y2="47" stroke="#c0c0c0" stroke-width="0.4"/>
    <line x1="18" y1="37" x2="10" y2="47" stroke="#c0c0c0" stroke-width="0.4"/>
    <ellipse cx="12" cy="39" rx="2" ry="1.5" fill="#f8f8f8" opacity="0.85"/>
  </g>
</svg>
