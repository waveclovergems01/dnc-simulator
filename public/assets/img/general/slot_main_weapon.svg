<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#686868"/>
      <stop offset="30%" stop-color="#e8e8e8"/>
      <stop offset="55%" stop-color="#f8f8f8"/>
      <stop offset="80%" stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#585858"/>
    </linearGradient>
    <linearGradient id="hilt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#505050"/>
      <stop offset="50%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#505050"/>
    </linearGradient>
  </defs>
  <!-- Sword tilted ~45deg, tip top-right, pommel bottom-left -->
  <g transform="rotate(-45, 32, 32)">
    <!-- Blade -->
    <polygon points="32,4 34,44 32,48 30,44" fill="url(#blade)" stroke="#2a2a2a" stroke-width="0.7"/>
    <!-- Blade fuller (groove) -->
    <line x1="32" y1="8" x2="32" y2="42" stroke="#a0a0a0" stroke-width="0.8"/>
    <!-- Blade highlight edge -->
    <line x1="31" y1="8" x2="30.5" y2="42" stroke="#f0f0f0" stroke-width="0.5"/>
    <!-- Cross guard -->
    <path d="M20 44 Q26 42 32 44 Q38 42 44 44 L44 47 Q38 45 32 47 Q26 45 20 47 Z" fill="url(#hilt)" stroke="#2a2a2a" stroke-width="0.8"/>
    <!-- Guard highlight -->
    <path d="M22 45 Q32 43 42 45" fill="none" stroke="#e0e0e0" stroke-width="0.8" stroke-linecap="round"/>
    <!-- Handle wrap -->
    <rect x="29.5" y="47" width="5" height="12" rx="2" fill="#707070" stroke="#2a2a2a" stroke-width="0.7"/>
    <line x1="29.5" y1="50" x2="34.5" y2="50" stroke="#909090" stroke-width="0.8"/>
    <line x1="29.5" y1="53" x2="34.5" y2="53" stroke="#909090" stroke-width="0.8"/>
    <line x1="29.5" y1="56" x2="34.5" y2="56" stroke="#909090" stroke-width="0.8"/>
    <!-- Pommel -->
    <circle cx="32" cy="61" r="4" fill="url(#hilt)" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="31" cy="60" r="1.5" fill="#e0e0e0"/>
  </g>
</svg>
