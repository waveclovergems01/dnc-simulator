<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="sg" cx="40%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#dcdcdc"/>
      <stop offset="55%" stop-color="#909090"/>
      <stop offset="100%" stop-color="#484848"/>
    </radialGradient>
  </defs>
  <!-- Left greave (back) -->
  <g transform="translate(3,0)">
    <!-- Shin plate -->
    <path d="M10 12 Q10 8 16 8 Q22 8 22 12 L22 40 Q22 46 16 48 Q10 46 10 40 Z" fill="url(#sg)" stroke="#2a2a2a" stroke-width="0.8"/>
    <!-- Shin highlight -->
    <path d="M13 13 Q15 10 18 12" fill="none" stroke="#f0f0f0" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Center ridge -->
    <path d="M16 10 L16 46" fill="none" stroke="#c0c0c0" stroke-width="0.7"/>
    <!-- Ankle protection -->
    <path d="M10 40 Q16 44 22 40 L22 46 Q16 50 10 46 Z" fill="#888" stroke="#2a2a2a" stroke-width="0.6"/>
    <!-- Knee cap top -->
    <ellipse cx="16" cy="22" rx="6" ry="5" fill="#c8c8c8" stroke="#3a3a3a" stroke-width="0.6"/>
    <path d="M12 21 Q16 19 20 21" fill="none" stroke="#f0f0f0" stroke-width="0.8" stroke-linecap="round"/>
    <!-- Straps -->
    <path d="M10 32 Q16 34 22 32" fill="none" stroke="#707070" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Rivet -->
    <circle cx="16" cy="33" r="1.2" fill="#d0d0d0" stroke="#555" stroke-width="0.4"/>
  </g>
  <!-- Right greave (mirrored) -->
  <g transform="translate(64,0) scale(-1,1)">
    <path d="M10 12 Q10 8 16 8 Q22 8 22 12 L22 40 Q22 46 16 48 Q10 46 10 40 Z" fill="url(#sg)" stroke="#2a2a2a" stroke-width="0.8"/>
    <path d="M13 13 Q15 10 18 12" fill="none" stroke="#f0f0f0" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M16 10 L16 46" fill="none" stroke="#c0c0c0" stroke-width="0.7"/>
    <path d="M10 40 Q16 44 22 40 L22 46 Q16 50 10 46 Z" fill="#888" stroke="#2a2a2a" stroke-width="0.6"/>
    <ellipse cx="16" cy="22" rx="6" ry="5" fill="#c8c8c8" stroke="#3a3a3a" stroke-width="0.6"/>
    <path d="M12 21 Q16 19 20 21" fill="none" stroke="#f0f0f0" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M10 32 Q16 34 22 32" fill="none" stroke="#707070" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="16" cy="33" r="1.2" fill="#d0d0d0" stroke="#555" stroke-width="0.4"/>
  </g>
</svg>
