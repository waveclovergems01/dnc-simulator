<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="rg" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="55%" stop-color="#909090"/>
      <stop offset="100%" stop-color="#484848"/>
    </radialGradient>
    <radialGradient id="gem" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="50%" stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#505050"/>
    </radialGradient>
  </defs>
  <!-- Ring band - outer -->
  <circle cx="32" cy="40" r="18" fill="none" stroke="url(#rg)" stroke-width="7"/>
  <!-- Ring band - inner shadow -->
  <circle cx="32" cy="40" r="14" fill="none" stroke="#303030" stroke-width="1"/>
  <!-- Ring band - outer highlight -->
  <circle cx="32" cy="40" r="21" fill="none" stroke="#2a2a2a" stroke-width="1"/>
  <!-- Band highlight arc -->
  <path d="M18 34 Q20 26 28 24" fill="none" stroke="#f0f0f0" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Gem setting prongs -->
  <path d="M26 18 L28 14 M32 17 L32 13 M38 18 L36 14" stroke="#aaaaaa" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Gem bezel -->
  <ellipse cx="32" cy="18" rx="8" ry="6" fill="#606060" stroke="#2a2a2a" stroke-width="0.8"/>
  <!-- Gem facets -->
  <ellipse cx="32" cy="18" rx="6" ry="4.5" fill="url(#gem)" stroke="#888" stroke-width="0.5"/>
  <line x1="32" y1="13.5" x2="32" y2="22.5" stroke="#d0d0d0" stroke-width="0.5"/>
  <line x1="26" y1="18" x2="38" y2="18" stroke="#d0d0d0" stroke-width="0.5"/>
  <line x1="27.5" y1="14.5" x2="36.5" y2="21.5" stroke="#d0d0d0" stroke-width="0.4"/>
  <line x1="36.5" y1="14.5" x2="27.5" y2="21.5" stroke="#d0d0d0" stroke-width="0.4"/>
  <!-- Gem highlight -->
  <ellipse cx="30" cy="16" rx="2" ry="1.5" fill="#f8f8f8" opacity="0.9"/>
